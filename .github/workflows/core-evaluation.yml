name: Core Evaluation

on:
  push:
  pull_request:

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:core
        env:
          EASY_AGENT_EVALUATION_ROOT: ${{ github.workspace }}/.artifacts/evaluations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evaluation-${{ github.run_id }}
          path: .artifacts/evaluations
          if-no-files-found: warn
